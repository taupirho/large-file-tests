[project]
name = "large-file-tests"
version = "0.1.0"
description = "Six memory-conscious ways to process large CSV files in Python"
readme = "README.md"
authors = [
    { name = "taupirho", email = "thomas.reid@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
]

[project.scripts]
large-file-tests = "large_file_tests:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
